<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Book Catalog</h1>

        <div class="filters">
            <div class="filter-group" style="flex: 0 0 300px;">
                <label for="searchBox">Search</label>
                <input type="text" id="searchBox" placeholder="Search titles, authors, series..." style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;" oninput="applySearch()">
            </div>

            <div class="filter-group">
                <label for="typeFilter">Type</label>
                <select id="typeFilter" onchange="loadBooks()">
                    <option value="">All</option>
                    <option value="book">Books</option>
                    <option value="magazine">Magazines</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="authorFilter">Author</label>
                <select id="authorFilter" onchange="loadBooks()">
                    <option value="">All Authors</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="ownedFilter">Ownership</label>
                <select id="ownedFilter" onchange="loadBooks()">
                    <option value="">All Books</option>
                    <option value="true">Owned</option>
                    <option value="false">Not Owned</option>
                </select>
            </div>

            <div class="filter-group" style="justify-content: flex-end;">
                <label>&nbsp;</label>
                <button onclick="loadBooks()">Apply Filters</button>
            </div>
        </div>

        <div class="filters" style="margin-top: 10px; padding: 10px;">
            <div class="filter-group">
                <label>Bulk eBay Estimates</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button onclick="runBulkEstimates('all')" style="background: #28a745;">All Books</button>
                    <button onclick="runBulkEstimates('owned')" style="background: #17a2b8;">Owned Only</button>
                    <button onclick="runBulkEstimates('not_owned')" style="background: #ffc107; color: #333;">Not Owned Only</button>
                    <button id="estimateSelectedBtn" onclick="runBulkEstimatesForSelected()" style="background: #6f42c1;" disabled>Estimate Selected (<span id="selectedCount">0</span>)</button>
                    <button onclick="clearSelection()" style="background: #6c757d;">Clear Selection</button>
                </div>
            </div>
        </div>

        <table class="books-table">
            <thead>
                <tr>
                    <th style="width: 32px; text-align: center;"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAllVisible(this)" title="Select all visible rows"></th>
                    <th>Series</th>
                    <th>Author</th>
                    <th>Title</th>
                    <th>Publisher</th>
                    <th>Publication Date</th>
                    <th>Stock #</th>
                    <th>Cover Price</th>
                    <th>Grade</th>
                    <th>Owned</th>
                    <th>eBay Estimate</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="booksTableBody">
                <tr>
                    <td colspan="12" class="loading">Loading books...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- eBay Search Modal -->
    <div id="ebayModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>eBay Search Results</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div id="ebayModalContent">
                <div class="loading">Loading search results...</div>
            </div>
        </div>
    </div>

    <!-- Update Book Modal -->
    <div id="updateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Update Book</h2>
                <span class="close" onclick="closeUpdateModal()">&times;</span>
            </div>
            <div id="updateModalContent">
                <div class="loading">Loading book information...</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
